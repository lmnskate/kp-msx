name: kp-msx

services:
  server:
    build: ./src
    image: kp-msx-server:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_BIND_HOST: 0.0.0.0
      SERVER_BIND_PORT: '8000'
      SERVER_PROXY_HEADERS: 'true'
      SERVER_SQLITE_URL: /data/kp-sqlite.db
    volumes:
      - ./data:/data
      - ./backups:/backups
    expose:
      - '8000'

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${SERVER_PORT:-1234}:1234'
    volumes:
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/icons:/usr/share/nginx/icons:ro
    depends_on:
      server:
        condition: service_healthy
